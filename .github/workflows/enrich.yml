name: Build static word stories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_word_data.py'
      - 'terms.csv'
      - 'questions.csv'
      - '.github/workflows/enrich.yml'

permissions:
  contents: write

concurrency:
  group: word-data-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Build static enrichment
        run: python scripts/build_word_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_data.json word_data_stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Build static word enrichment"
          git pull --rebase origin main
          git push
